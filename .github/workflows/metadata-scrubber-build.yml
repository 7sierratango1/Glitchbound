name: Build Metadata Scrubber APK
on:
  workflow_dispatch:
  push:
    branches: [ metadata-scrubber-build1-apk-run ]
    paths:
      - '.metadata_scrubber_build/**'
      - '.github/workflows/metadata-scrubber-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reassemble source archive
        run: cat .metadata_scrubber_build/part* | base64 -d > MetadataScrubber-Build1-Source.zip
      - name: Verify archive
        run: unzip -t MetadataScrubber-Build1-Source.zip
      - name: Unpack source
        run: unzip -q MetadataScrubber-Build1-Source.zip
      - name: Apply Android 16 compatibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MetadataScrubber-Build1/app/src/main/java/com/technicallyunavailable/metadatascrubber/MediaCleaner.java')
          s = p.read_text()
          old = 'finally { r.release(); }'
          new = 'finally { try { r.release(); } catch (java.io.IOException ignored) {} }'
          if old not in s:
              raise SystemExit('Expected MediaMetadataRetriever cleanup line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build debug APK
        working-directory: MetadataScrubber-Build1
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect APK
        run: cp MetadataScrubber-Build1/app/build/outputs/apk/debug/app-debug.apk MetadataScrubber-Build1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MetadataScrubber-Build1-APK
          path: MetadataScrubber-Build1.apk
          if-no-files-found: error
