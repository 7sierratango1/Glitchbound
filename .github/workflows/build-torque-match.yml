name: Build Torque Match APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'torque-match/**'
      - '.github/workflows/build-torque-match.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torque-match
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TorqueMatch-v0.5.1-debug.apk
      - name: Package source
        working-directory: .
        run: zip -r TorqueMatch-v0.5.1-Source.zip torque-match -x 'torque-match/.gradle/*' 'torque-match/app/build/*'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TorqueMatch-v0.5.1-APK
          path: torque-match/TorqueMatch-v0.5.1-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: TorqueMatch-v0.5.1-Source
          path: TorqueMatch-v0.5.1-Source.zip
          if-no-files-found: error
          retention-days: 30
