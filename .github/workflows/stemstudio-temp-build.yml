name: Stem Studio Temporary APK Build

on:
  push:
    branches: [ stemstudio-build-temp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Stem Studio source
        run: |
          mkdir -p /tmp/stemstudio
          curl -fsSL https://raw.githubusercontent.com/7sierratango1/foxholegaming/stemstudio-build-temp/stemstudio-build/chunk00.b64 -o /tmp/c0
          curl -fsSL https://raw.githubusercontent.com/7sierratango1/foxholegaming/stemstudio-build-temp/stemstudio-build/chunk01.b64 -o /tmp/c1
          curl -fsSL https://raw.githubusercontent.com/7sierratango1/foxholegaming/stemstudio-build-temp/stemstudio-build/chunk02.b64 -o /tmp/c2
          cat /tmp/c0 /tmp/c1 /tmp/c2 | base64 -d > /tmp/stemstudio.zip
          unzip -q /tmp/stemstudio.zip -d /tmp/stemstudio
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: /tmp/stemstudio/StemStudioAndroid
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StemStudio-debug-apk
          path: /tmp/stemstudio/StemStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
