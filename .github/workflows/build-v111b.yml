name: Build Glitchbound v1.1.1 Retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v111b.yml'
      - '.build/v111_patch.py'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct baseline
        run: cat .build/v083.part1 .build/v083.part2 .build/v083.part3 | base64 -d | gzip -d > app/src/main/assets/www/game.js
      - name: Normalize v100
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.build/v100_patch.py');s=p.read_text();s=s.replace("must(old,new,'choice caps')", "s,n=re.subn(r\"let pool=\\[\\.\\.\\.SKILLS\\].*?,el=\\$\\('#choiceList'\\);\",new,s,count=1); n==1 or (_ for _ in ()).throw(SystemExit('missing choice caps'))");p.write_text(s)
          PY
      - name: Apply full revision chain
        run: |
          python3 .build/v100_patch.py
          python3 .build/v101_patch.py
          python3 .build/v102_patch.py
          python3 .build/v103_patch.py
          python3 .build/v110_patch.py
          python3 .build/v111_patch.py
          node --check app/src/main/assets/www/game.js
      - name: Version
        run: |
          sed -i "s/versionCode 11/versionCode 25/" app/build.gradle
          sed -i "s/versionName '0.8.2'/versionName '1.1.1'/" app/build.gradle
          grep -q "versionCode 25" app/build.gradle
          grep -q "versionName '1.1.1'" app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Glitchbound-v1.1.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Glitchbound-v1.1.1-APK
          path: Glitchbound-v1.1.1-debug.apk
          retention-days: 90
