name: Build Glitchbound v0.8.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v083.yml'

permissions:
  contents: read

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reapply exact v0.8.2 balance baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/build-v082.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(y) if "python3 - <<'PY'" in l)+1
          end=next(i for i in range(start,len(y)) if y[i].strip()=='PY')
          code='\n'.join((l[10:] if l.startswith('          ') else l) for l in y[start:end])
          exec(compile(code,'v082_patch','exec'))
          PY

      - name: Apply v0.8.3 control and detailed art pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/www/game.js')
          s=p.read_text()

          # Add bushes to the existing, lower-density v0.8.2 scenery distribution.
          s=s.replace("function sceneryRadius(o){return o.type==='hut'?34:o.type==='ruin'?31:o.type==='tree'?24:22}","function sceneryRadius(o){return o.type==='hut'?34:o.type==='ruin'?31:o.type==='tree'?24:o.type==='bush'?18:22}")
          s=s.replace("let type=k%11===0||k%17===0?'hut':k%8===0?'ruin':k%5===0?'rock':'tree';","let type=k%11===0||k%17===0?'hut':k%8===0?'ruin':k%5===0?'rock':k%4===0?'bush':'tree';")

          def replace_between(start_sig,end_sig,new_text):
              global s
              a=s.find(start_sig)
              if a<0: raise SystemExit('missing '+start_sig)
              b=s.find(end_sig,a)
              if b<0: raise SystemExit('missing '+end_sig)
              s=s[:a]+new_text+s[b:]

          replace_between("function drawScenery(o){","function drawGate(i){",'''function drawScenery(o){let x=sx(o.x),y=sy(o.y);if(x<-120||x>540||y<-150||y>900)return;ctx.save();ctx.translate(x,y);let z=o.seed||1;if(o.type==='tree'){ctx.fillStyle='#302116';ctx.fillRect(-6,-3,12,40);ctx.fillStyle='#17361f';for(let i=0;i<8;i++){let a=i*2.2+z*.11,r=10+(i%3)*7;ctx.beginPath();ctx.arc(Math.cos(a)*r*.6,-29+Math.sin(a)*r*.45,12+(i%2)*4,0,7);ctx.fill()}ctx.fillStyle='#3e7139';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc((i-1.5)*8,-43-(i%2)*5,7,0,7);ctx.fill()}}else if(o.type==='bush'){ctx.fillStyle='#173b20';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc((i-2)*7,(i%2)*-5,10,0,7);ctx.fill()}ctx.fillStyle='#517e42';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(-15+i*6,-7-(i%3)*3,3,0,7);ctx.fill()}}else if(o.type==='hut'){ctx.fillStyle='#5c4530';ctx.fillRect(-29,-14,58,42);ctx.strokeStyle='#95704a';ctx.lineWidth=3;ctx.strokeRect(-29,-14,58,42);ctx.fillStyle='#241a16';ctx.beginPath();ctx.moveTo(-38,-14);ctx.lineTo(0,-47);ctx.lineTo(38,-14);ctx.closePath();ctx.fill();ctx.fillStyle='#171210';ctx.fillRect(-8,3,16,25);ctx.fillStyle='#e3aa58';ctx.fillRect(13,-3,9,8);ctx.fillStyle='#3b2b21';ctx.fillRect(-23,-10,5,37);ctx.fillRect(18,-10,5,37)}else if(o.type==='ruin'){ctx.fillStyle='#56514a';ctx.fillRect(-29,-23,14,48);ctx.fillRect(13,-10,17,35);ctx.fillRect(-29,9,59,11);ctx.fillStyle='#817a70';ctx.fillRect(-26,-19,8,7);ctx.fillRect(16,-6,10,7);ctx.fillStyle='#233224';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-18+i*12,21+(i%2)*3,5,0,7);ctx.fill()}}else{ctx.fillStyle='#444842';ctx.beginPath();ctx.moveTo(-20,16);ctx.lineTo(-26,-5);ctx.lineTo(-9,-22);ctx.lineTo(14,-18);ctx.lineTo(25,8);ctx.lineTo(8,21);ctx.closePath();ctx.fill();ctx.fillStyle='#71766d';ctx.beginPath();ctx.moveTo(-10,-15);ctx.lineTo(8,-12);ctx.lineTo(14,2);ctx.lineTo(-4,5);ctx.closePath();ctx.fill()}ctx.restore()}
''')

          replace_between("function drawHero(){","function drawEnemy(e){",'''function drawHero(){let x=sx(run.p.x),y=sy(run.p.y),a=run.fireFacing||-Math.PI/2;ctx.save();ctx.translate(x,y);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,23,25,10,0,0,7);ctx.fill();ctx.rotate(a+Math.PI/2);ctx.strokeStyle='#291a12';ctx.lineWidth=2;ctx.fillStyle='#c18b5f';ctx.beginPath();ctx.moveTo(-18,10);ctx.lineTo(-20,-10);ctx.lineTo(-13,-29);ctx.lineTo(-7,-36);ctx.lineTo(7,-36);ctx.lineTo(13,-29);ctx.lineTo(20,-10);ctx.lineTo(18,10);ctx.lineTo(9,19);ctx.lineTo(-9,19);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#d9a779';ctx.beginPath();ctx.arc(0,-40,10,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#352117';ctx.beginPath();ctx.arc(0,-44,10,Math.PI,6.28);ctx.fill();ctx.beginPath();ctx.moveTo(-9,-40);ctx.lineTo(-14,-27);ctx.lineTo(-5,-31);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(9,-40);ctx.lineTo(14,-27);ctx.lineTo(5,-31);ctx.closePath();ctx.fill();ctx.fillStyle='#1c1411';ctx.beginPath();ctx.moveTo(-7,-34);ctx.lineTo(0,-27);ctx.lineTo(7,-34);ctx.lineTo(5,-22);ctx.lineTo(0,-18);ctx.lineTo(-5,-22);ctx.closePath();ctx.fill();ctx.fillStyle='#6b4d35';ctx.fillRect(-18,-7,36,10);ctx.fillStyle='#8d6846';ctx.fillRect(-4,-7,8,30);ctx.fillStyle='#493226';ctx.beginPath();ctx.moveTo(-17,8);ctx.lineTo(-9,18);ctx.lineTo(-12,33);ctx.lineTo(-21,31);ctx.lineTo(-18,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(17,8);ctx.lineTo(9,18);ctx.lineTo(12,33);ctx.lineTo(21,31);ctx.lineTo(18,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#6b4a31';ctx.fillRect(-19,-13,7,20);ctx.fillRect(12,-13,7,20);ctx.strokeStyle='#dce1e4';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(17,-4);ctx.lineTo(34,-22);ctx.stroke();ctx.fillStyle='#e4e8ea';ctx.beginPath();ctx.moveTo(34,-22);ctx.lineTo(44,-33);ctx.lineTo(39,-18);ctx.closePath();ctx.fill();ctx.strokeStyle='#6b4a31';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-17,-4);ctx.lineTo(-32,-19);ctx.stroke();ctx.fillStyle='#d1d6d9';ctx.beginPath();ctx.moveTo(-32,-19);ctx.lineTo(-41,-30);ctx.lineTo(-36,-16);ctx.closePath();ctx.fill();ctx.restore()}
''')

          replace_between("function drawEnemy(e){","function drawShot(s){",'''function drawEnemy(e){let x=sx(e.x),y=sy(e.y);if(x<-110||x>530||y<-130||y>890)return;ctx.save();ctx.translate(x,y);let boss=e.kind==='boss'||e.kind==='worldboss',sc=e.r/18*(boss?1.1:1);ctx.scale(sc,sc);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,20,22,8,0,0,7);ctx.fill();let t=e.type%6;ctx.strokeStyle='#1b1010';ctx.lineWidth=2;if(t===0){ctx.fillStyle='#722d22';ctx.beginPath();ctx.moveTo(-20,16);ctx.lineTo(-23,-8);ctx.lineTo(-14,-27);ctx.lineTo(-7,-36);ctx.lineTo(0,-29);ctx.lineTo(7,-36);ctx.lineTo(14,-27);ctx.lineTo(23,-8);ctx.lineTo(20,16);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#281413';ctx.beginPath();ctx.moveTo(-11,-25);ctx.lineTo(-24,-44);ctx.lineTo(-5,-34);ctx.moveTo(11,-25);ctx.lineTo(24,-44);ctx.lineTo(5,-34);ctx.fill();ctx.fillStyle='#ff6736';ctx.beginPath();ctx.arc(-6,-16,3,0,7);ctx.arc(6,-16,3,0,7);ctx.fill();ctx.fillStyle='#d1c09d';for(let k=-2;k<=2;k++)ctx.fillRect(k*4,-3,2,7)}else if(t===1){ctx.fillStyle='#4b493f';ctx.beginPath();ctx.moveTo(-24,16);ctx.lineTo(-21,-15);ctx.lineTo(-12,-30);ctx.lineTo(0,-38);ctx.lineTo(12,-30);ctx.lineTo(21,-15);ctx.lineTo(24,16);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#777870';ctx.fillRect(-17,-11,34,12);ctx.fillStyle='#2b211d';ctx.beginPath();ctx.moveTo(-15,-29);ctx.lineTo(-29,-43);ctx.lineTo(-10,-34);ctx.moveTo(15,-29);ctx.lineTo(29,-43);ctx.lineTo(10,-34);ctx.fill();ctx.fillStyle='#f2c65d';ctx.fillRect(-9,-22,5,3);ctx.fillRect(4,-22,5,3);ctx.fillStyle='#352820';ctx.fillRect(-18,4,36,8)}else if(t===2){ctx.fillStyle='#7e3324';ctx.beginPath();ctx.moveTo(-22,17);ctx.lineTo(-18,-20);ctx.lineTo(-9,-35);ctx.lineTo(0,-43);ctx.lineTo(9,-35);ctx.lineTo(18,-20);ctx.lineTo(22,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#291511';ctx.beginPath();ctx.moveTo(-13,-25);ctx.lineTo(0,-34);ctx.lineTo(13,-25);ctx.lineTo(8,-11);ctx.lineTo(-8,-11);ctx.closePath();ctx.fill();ctx.fillStyle='#ff7a35';for(let k=0;k<6;k++){ctx.beginPath();ctx.arc((k-2.5)*5,-4-Math.abs(k-2.5)*2,2.5,0,7);ctx.fill()}ctx.strokeStyle='#bbb0a2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,5);ctx.lineTo(-31,14);ctx.moveTo(18,5);ctx.lineTo(31,14);ctx.stroke()}else if(t===3){ctx.fillStyle='#304c45';ctx.beginPath();ctx.ellipse(0,-5,21,31,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#72966e';ctx.beginPath();ctx.moveTo(-15,-20);ctx.lineTo(-31,-34);ctx.lineTo(-14,-7);ctx.moveTo(15,-20);ctx.lineTo(31,-34);ctx.lineTo(14,-7);ctx.fill();ctx.fillStyle='#c4dfc3';for(let k=0;k<4;k++){ctx.beginPath();ctx.arc((k-1.5)*6,-18,2.5,0,7);ctx.fill()}ctx.strokeStyle='#172720';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-12,4);ctx.quadraticCurveTo(0,16,12,4);ctx.stroke()}else if(t===4){ctx.fillStyle='#293b5a';ctx.beginPath();ctx.moveTo(-20,17);ctx.lineTo(-24,-8);ctx.lineTo(-14,-29);ctx.lineTo(0,-39);ctx.lineTo(14,-29);ctx.lineTo(24,-8);ctx.lineTo(20,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#a7e0f7';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,-6);ctx.lineTo(-32,-17);ctx.moveTo(18,-6);ctx.lineTo(32,-17);ctx.stroke();ctx.fillStyle='#dbf7ff';ctx.fillRect(-10,-21,6,4);ctx.fillRect(4,-21,6,4)}else{ctx.fillStyle='#55265e';ctx.beginPath();ctx.moveTo(-22,17);ctx.lineTo(-19,-20);ctx.lineTo(-10,-35);ctx.lineTo(0,-47);ctx.lineTo(10,-35);ctx.lineTo(19,-20);ctx.lineTo(22,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#1b0d22';ctx.beginPath();ctx.arc(0,-18,13,0,7);ctx.fill();ctx.fillStyle='#e66dff';ctx.beginPath();ctx.arc(-5,-20,3,0,7);ctx.arc(5,-20,3,0,7);ctx.fill();ctx.strokeStyle='#a273b2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-12,-28);ctx.lineTo(-26,-45);ctx.moveTo(12,-28);ctx.lineTo(26,-45);ctx.stroke()}if(boss){ctx.strokeStyle=e.kind==='worldboss'?'#f2b53d':'#d5d2c8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-10,31,0,7);ctx.stroke();ctx.fillStyle='#201417';ctx.fillRect(-38,-57,76,7);ctx.fillStyle=e.kind==='worldboss'?'#ff9b24':'#d94b4d';ctx.fillRect(-38,-57,76*e.hp/e.maxHp,7);ctx.fillStyle='#f0d3a0';ctx.beginPath();ctx.moveTo(-20,-36);ctx.lineTo(-32,-52);ctx.lineTo(-12,-41);ctx.moveTo(20,-36);ctx.lineTo(32,-52);ctx.lineTo(12,-41);ctx.fill();if(e.kind==='worldboss'){ctx.strokeStyle='#ff6a2a';ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(0,-10,36+i*4,.2+i*.7,.55+i*.7);ctx.stroke()}}}ctx.restore()}
''')

          # Add subtle grass, rubble and small stones over the colored terrain.
          marker="ctx.fillStyle=g;ctx.fillRect(0,0,420,760);for(let i=1;i<=12;i++)"
          terrain="ctx.fillStyle=g;ctx.fillRect(0,0,420,760);ctx.globalAlpha=.28;for(let k=0;k<52;k++){let wx=(k*97+run.area*53)%WORLD_W,wy=(k*163+run.area*71)%WORLD_H,x=sx(wx),y=sy(wy);if(x<-10||x>430||y<-10||y>770)continue;if(k%3===0){ctx.strokeStyle='#254722';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y-8);ctx.moveTo(x,y);ctx.lineTo(x+2,y-7);ctx.stroke()}else{ctx.fillStyle=k%2?'#85755e':'#5e584e';ctx.beginPath();ctx.ellipse(x,y,3+(k%3),2+(k%2),0,0,7);ctx.fill()}}ctx.globalAlpha=1;for(let i=1;i<=12;i++)"
          if marker not in s: raise SystemExit('missing terrain marker')
          s=s.replace(marker,terrain,1)

          # Robust floating joystick reset across pointer capture loss and Android WebView lifecycle changes.
          old="canvas.style.touchAction='none';canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch{}let p=pos(e.clientX,e.clientY);pointer={id:e.pointerId,ox:p.x,oy:p.y,dx:0,dy:0}},{passive:false});canvas.addEventListener('pointermove',e=>{if(pointer&&pointer.id===e.pointerId){e.preventDefault();stick(e.clientX,e.clientY)}},{passive:false});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);addEventListener('keydown',e=>keys.add(e.key));addEventListener('keyup',e=>keys.delete(e.key));"
          new="function resetPointer(){pointer=null}canvas.style.touchAction='none';canvas.addEventListener('pointerdown',e=>{e.preventDefault();resetPointer();let p=pos(e.clientX,e.clientY);pointer={id:e.pointerId,ox:p.x,oy:p.y,dx:0,dy:0};try{canvas.setPointerCapture(e.pointerId)}catch{}},{passive:false});canvas.addEventListener('pointermove',e=>{if(pointer&&pointer.id===e.pointerId){e.preventDefault();stick(e.clientX,e.clientY)}},{passive:false});canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id===e.pointerId)resetPointer()});canvas.addEventListener('pointercancel',resetPointer);canvas.addEventListener('lostpointercapture',resetPointer);document.addEventListener('visibilitychange',()=>{if(document.hidden)resetPointer()});window.addEventListener('blur',resetPointer);window.addEventListener('pageshow',resetPointer);if(!window.PointerEvent){canvas.addEventListener('touchstart',e=>{e.preventDefault();let t=e.changedTouches[0],p=pos(t.clientX,t.clientY);pointer={id:t.identifier,ox:p.x,oy:p.y,dx:0,dy:0}},{passive:false});canvas.addEventListener('touchmove',e=>{let t=[...e.changedTouches].find(t=>pointer&&t.identifier===pointer.id);if(t){e.preventDefault();stick(t.clientX,t.clientY)}},{passive:false});canvas.addEventListener('touchend',resetPointer,{passive:false});canvas.addEventListener('touchcancel',resetPointer,{passive:false})}addEventListener('keydown',e=>keys.add(e.key));addEventListener('keyup',e=>keys.delete(e.key));"
          if old not in s: raise SystemExit('missing pointer block')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          node --check app/src/main/assets/www/game.js
          sed -i "s/versionCode 10/versionCode 12/" app/build.gradle
          sed -i "s/versionName '0.8.1'/versionName '0.8.3'/" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Glitchbound-v0.8.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glitchbound-v0.8.3-APK
          path: Glitchbound-v0.8.3-debug.apk
          retention-days: 90
