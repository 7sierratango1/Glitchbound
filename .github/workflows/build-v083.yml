name: Build Glitchbound v0.8.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v083.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.8.3 game source
        shell: bash
        run: |
          cat .build/v083.part1 .build/v083.part2 .build/v083.part3 | base64 -d | gzip -d > app/src/main/assets/www/game.js
          node --check app/src/main/assets/www/game.js
          sed -i "s/versionCode 10/versionCode 12/" app/build.gradle
          sed -i "s/versionName '0.8.1'/versionName '0.8.3'/" app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Glitchbound-v0.8.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glitchbound-v0.8.3-APK
          path: Glitchbound-v0.8.3-debug.apk
          retention-days: 90
