name: Build Malfunction Marbles v0.3.0 APK

on:
  push:
    branches: [ malfunction-marbles-build ]
    paths:
      - 'malfunction-v030/**'
      - '.github/workflows/build-malfunction-v030.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore source
        run: |
          mkdir -p mm030
          base64 -d malfunction-v030/source.zip.b64 > MalfunctionMarbles-v0.3.0-source.zip
          unzip -q MalfunctionMarbles-v0.3.0-source.zip -d mm030
      - name: Build debug APK
        working-directory: mm030
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp mm030/app/build/outputs/apk/debug/app-debug.apk MalfunctionMarbles-v0.3.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalfunctionMarbles-v0.3.0-APK
          path: MalfunctionMarbles-v0.3.0.apk
      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: MalfunctionMarbles-v0.3.0-Source
          path: MalfunctionMarbles-v0.3.0-source.zip
