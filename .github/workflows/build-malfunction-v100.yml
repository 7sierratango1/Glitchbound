name: Build Malfunction Marbles v0.10.0 APK

on:
  push:
    branches: [ malfunction-marbles-build ]
    paths:
      - 'malfunction-v100/**'
      - '.github/workflows/build-malfunction-v100.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore v0.3.0 baseline
        run: |
          mkdir -p mm040
          base64 -d malfunction-v030/source.zip.b64 > baseline.zip
          unzip -q baseline.zip -d mm040
      - name: Apply v0.4.0 upgrade
        run: python malfunction-v040/upgrade.py
      - name: Promote to v0.5.0 workspace
        run: mv mm040 mm050
      - name: Apply v0.5.0 upgrade
        run: python malfunction-v050/upgrade.py
      - name: Promote to v0.6.0 workspace
        run: mv mm050 mm060
      - name: Apply v0.6.0 upgrade
        run: python malfunction-v060/upgrade.py
      - name: Promote to v0.7.0 workspace
        run: mv mm060 mm070
      - name: Apply v0.7.0 upgrade
        run: python malfunction-v070/upgrade.py
      - name: Promote to v0.8.0 workspace
        run: mv mm070 mm080
      - name: Apply v0.8.0 arcade geometry upgrade
        run: python malfunction-v080/upgrade.py
      - name: Promote to v0.9.0 workspace
        run: mv mm080 mm090
      - name: Apply v0.9.0 independent physics upgrade
        run: python malfunction-v090/upgrade.py
      - name: Promote to v0.10.0 workspace
        run: mv mm090 mm100
      - name: Apply v0.10.0 start and pacing upgrade
        run: python malfunction-v100/upgrade.py
      - name: Package source
        run: cd mm100 && zip -qr ../MalfunctionMarbles-v0.10.0-source.zip .
      - name: Build debug APK
        working-directory: mm100
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp mm100/app/build/outputs/apk/debug/app-debug.apk MalfunctionMarbles-v0.10.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalfunctionMarbles-v0.10.0-APK
          path: MalfunctionMarbles-v0.10.0.apk
      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: MalfunctionMarbles-v0.10.0-Source
          path: MalfunctionMarbles-v0.10.0-source.zip
